# Edit this file to add, disable, or remove models. Secrets must stay in .env.
# The API automatically reloads this file when it changes.
default_model: qwen3.7-flash
router_model: qwen3.7-flash-2026-07-15

models:
  - id: mimo-v2.5-pro
    display_name: MiMo V2.5 Pro
    description: Xiaomi flagship model for reasoning, coding, and agent tasks
    provider: openai
    model: mimo-v2.5-pro
    api_key_env: MIMO_API_KEY
    base_url_env: MIMO_BASE_URL
    enabled: true

  - id: qwen3.7-flash
    display_name: qwen3.7-flash
    description: Qwen model for reasoning and coding tasks
    provider: openai
    model: qwen3.7-flash
    api_key_env: DASHSCOPE_API_KEY
    base_url_env: DASHSCOPE_BASE_URL
    enabled: true

  - id: qwen3.7-flash-2026-07-15
    display_name: qwen3.7-flash-2026-07-15
    description: Balanced Qwen model for general chat and travel planning
    provider: openai
    model: qwen3.7-flash-2026-07-15
    api_key_env: DASHSCOPE_API_KEY
    base_url_env: DASHSCOPE_BASE_URL
    enabled: true

  - id: qwen3.7-max-2026-05-17
    display_name: Qwen3.7 Max (2026-05-17)
    description: Fixed Qwen3.7 Max snapshot for reproducible behavior
    provider: openai
    model: qwen3.7-max-2026-05-17
    api_key_env: DASHSCOPE_API_KEY
    base_url_env: DASHSCOPE_BASE_URL
    enabled: true

  - id: qwen3.6-max-preview
    display_name: qwen3.6-max-preview
    description: Preview of Qwen3.6 Max model for reasoning and coding tasks
    provider: openai
    model: qwen3.6-max-preview
    api_key_env: DASHSCOPE_API_KEY
    base_url_env: DASHSCOPE_BASE_URL
    enabled: true

  - id: qwen3.5-omni-plus-2026-03-15
    display_name: Qwen3.5 Omni Plus (2026-03-15)
    description: Multimodal Qwen snapshot; the current chat UI sends text only
    provider: openai
    model: qwen3.5-omni-plus-2026-03-15
    api_key_env: DASHSCOPE_API_KEY
    base_url_env: DASHSCOPE_BASE_URL
    enabled: true

  - id: qwen3.7-max-2026-05-20
    display_name: qwen3.7-max-2026-05-20
    description: Latest Qwen3.7 Max snapshot for reasoning and coding tasks
    provider: openai
    model: qwen3.7-max-2026-05-20
    api_key_env: DASHSCOPE_API_KEY
    base_url_env: DASHSCOPE_BASE_URL
    enabled: true
