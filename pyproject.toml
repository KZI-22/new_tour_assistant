[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tour-assistant"
version = "0.1.0"
description = "A configurable multi-agent travel assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.139,<1",
  "httpx>=0.28,<1",
  "langchain>=1.2,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.1,<2",
  "langchain-anthropic>=1.3,<2",
  "langchain-google-genai>=4.2,<5",
  "mcp>=1.28,<2",
  "PyJWT>=2.10,<3",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.2,<2",
  "PyYAML>=6.0,<7",
  "redis>=6.2,<9",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
markers = [
  "amap: consumes the configured Amap Web Service API quota",
  "database: requires the local PostgreSQL test database",
  "e2e: consumes configured model and travel-provider quotas",
  "flyai: consumes the configured FlyAI request quota",
  "redis: requires the local Redis integration-test service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["app*"]
