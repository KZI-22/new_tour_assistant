[alembic]
script_location = %(here)s/apps/api/alembic
prepend_sys_path = %(here)s/apps/api
path_separator = os
sqlalchemy.url = postgresql+asyncpg://tour_assistant:tour_assistant_dev@localhost:5432/tour_assistant

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

